services:
  requirements-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/requirements-rpc", "start"]
    environment:
      PORT: "4101"
      HARNESS_ROOT: /app
    ports:
      - "4101:4101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  coding-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/coding-rpc", "start"]
    environment:
      PORT: "4102"
      HARNESS_ROOT: /app
    ports:
      - "4102:4102"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  testing-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/testing-rpc", "start"]
    environment:
      PORT: "4103"
      HARNESS_ROOT: /app
    ports:
      - "4103:4103"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  deploy-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/deploy-rpc", "start"]
    environment:
      PORT: "4104"
      HARNESS_ROOT: /app
    ports:
      - "4104:4104"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4104/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator-rpc:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/orchestrator-rpc", "start"]
    environment:
      PORT: "4100"
      HARNESS_ROOT: /app
      REQUIREMENTS_RPC_URL: http://requirements-rpc:4101
      CODING_RPC_URL: http://coding-rpc:4102
      TESTING_RPC_URL: http://testing-rpc:4103
      DEPLOY_RPC_URL: http://deploy-rpc:4104
    ports:
      - "4100:4100"
    depends_on:
      requirements-rpc:
        condition: service_healthy
      coding-rpc:
        condition: service_healthy
      testing-rpc:
        condition: service_healthy
      deploy-rpc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@harness/web", "dev"]
    environment:
      VITE_ORCHESTRATOR_URL: http://localhost:4100
    ports:
      - "5173:5173"
    depends_on:
      orchestrator-rpc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

